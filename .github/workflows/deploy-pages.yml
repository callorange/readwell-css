name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build CSS & Run Tests
        run: |
          npm run build
          npm test

      - name: Assemble Static Site
        run: |
          mkdir -p _site/dist _site/examples
          cp -r dist/* _site/dist/
          cp -r examples/* _site/examples/
          cat << 'EOF' > _site/index.html
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Readwell CSS</title>
            <meta http-equiv="refresh" content="0; url=./examples/">
            <script>location.replace('./examples/');</script>
          </head>
          <body>
            <p>Redirecting to <a href="./examples/">Readwell CSS Examples Hub</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
